@if (isLoading()) {
<div class="fixed inset-0 bg-black bg-opacity-50 z-50 backdrop-blur-sm flex flex-col items-center justify-center gap-4"
    aria-modal="true" role="dialog" aria-label="Indicador de progreso">

    @if (message().includes('Conexión perdida')) {
    <div class="text-red-500 text-4xl animate-pulse">⚠️</div>
    } @else {
    <div
        class="w-12 h-12 border-4 border-t-red-600 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin">
    </div>
    }

    <p class="text-white text-lg font-medium">{{ message() }}</p>
</div>
}
