<div class="min-h-screen flex flex-col bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-red-700 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="assets/images/gb2.png" alt="gob.pe" class="h-6" />
                <span class="text-lg font-medium">Registro de Visitas en Línea</span>
            </div>
            <div class="flex items-center gap-2 cursor-pointer">
                <i class="bi bi-person-fill"></i>
                <span class="text-sm">Aldo Arzeno</span>
                <i class="pi pi-angle-down" style="font-size: 0.6rem"></i>
            </div>
        </div>
    </header>

    <div class="flex-1 w-full px-10 py-6">

        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm mb-2">
            <a href="bienvenida">
                <i class="bi bi-house-door-fill text-blue-600"></i>
            </a>
            <span>/</span>
            <a href="agenda-oficial">
                <span class="text-blue-600">Gestión de intereses fuera de la entidad</span>
            </a>
            <span>/</span>
            <span class="text-blue-600 font-medium">Añadir Evento</span>
        </nav>

        <!-- Título -->
        <h1 class="text-xl font-bold mb-4">
            JEFE DE OFICINA - CALDERON OROZCO GUIDO LINO
        </h1>

        <!-- Subtítulo -->
        <h2 class="text-sm font-semibold mb-4">Añadir evento</h2>

        <!-- Formulario -->
        <div class="max-w-2xl">

            <!-- Asunto -->
            <div class="mb-4 flex flex-row gap-2">
                <label class="w-40 block text-xs mb-1">Asunto</label>
                <div class="w-full">
                    <input type="text"
                        class="w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-600" />
                    <label class="flex items-center gap-2 mt-2 text-xs text-gray-600">
                        <input type="checkbox" class="w-3 h-3" />
                        No se registraron eventos
                    </label>
                </div>
            </div>

            <!-- Lugar -->
            <div class="mb-4 flex flex-row gap-2">
                <label class="w-40 text-xs mb-1">Lugar específico:</label>
                <input type="text" placeholder="Text"
                    class="w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-600" />
            </div>

            <!-- Fecha -->
            <div class="mb-4 flex items-center gap-2">
                <label class="w-40 text-sm">Fecha:</label>
                <input type="text" value="04/02/26"
                    class="w-40 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-600" />
            </div>

            <!-- Hora inicio -->
            <div class="mb-4 flex items-center gap-2">
                <label class="w-40 text-xs mb-1">Hora inicio:</label>
                <input type="time" value="02:30"
                    class="w-40 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-600" />
            </div>

            <!-- Hora fin -->
            <div class="mb-4 flex items-center gap-2">
                <label class="w-40 text-xs mb-1">Hora fin:</label>
                <div>
                    <input type="time" value="03:00"
                        class="w-40 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-600" />
                    <!-- Activo -->
                    <div class="mt-2">
                        <label class="flex items-center gap-2 text-xs">
                            <input type="checkbox" checked class="w-3 h-3 accent-blue-600" />
                            Activo
                        </label>
                    </div>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex gap-2">
                <a href="agenda-oficial">
                    <button
                        class="px-6 py-2 bg-[#e2f1f8] text-sm border border-gray-300 text-gray-700 font-medium transition transform hover:scale-105 duration-200 ease-in-out">
                        CERRAR
                    </button>
                </a>
                <button
                    class="px-6 py-2 bg-[#2f598a] text-white text-sm font-medium hover:bg-blue-700 transition flex items-center gap-2 transition transform hover:scale-105 duration-200 ease-in-out">
                    <i class="bi bi-lock-fill text-xs"></i>
                    GUARDAR
                </button>
            </div>
        </div>

    </div>

    <!-- Footer siempre al fondo -->
    <footer class="bg-[#26292e] text-white py-5 text-center text-sm font-medium mt-auto">
        SECRETARÍA DE GOBIERNO Y TRANSFORMACIÓN DIGITAL © 2026
    </footer>

</div>
