<div
    class="inline-flex items-center justify-center bg-gray-100 border border-gray-300 text-gray-800 rounded-md p-1 relative">
    {{item()}}
    <button (click)="remove.emit(item().id)" type="button"
        class="ml-2 text-red-600 hover:text-red-800 focus:outline-none" [pTooltip]="'Eliminar'">
        <i class="pi pi-times-circle"></i>
    </button>
</div>
