<div class="min-h-screen flex flex-col bg-gray-50 font-sans">
    <!-- Header -->
    <header class="bg-red-700 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="assets/images/gb2.png" alt="gob.pe" class="h-6" />
                <span class="text-lg font-medium">Registro de Visitas en Línea</span>
            </div>
            <div class="flex items-center gap-2 cursor-pointer">
                <i class="bi bi-person-fill"></i>
                <span class="text-sm">Aldo Arzeno</span>
                <i class="pi pi-angle-down" style="font-size: 0.6rem"></i>
            </div>
        </div>
    </header>
    <!-- Main Content -->
    <div class="flex-1 max-w-7xl mx-auto px-6 py-4 w-full">

        <!-- Contenedor único: título, descripción y card comparten exactamente el mismo ancho y alineación -->
        <div class="max-w-2xl mx-auto">

            <h1 class="text-4xl font-bold text-gray-900 mb-8">
                Registrando visitas
            </h1>

            <p class="text-sm mb-4">
                Registra la salida de las visitas pendientes y completa los datos o escanea un documento
                de identidad para registrar una nueva visita a la entidad.
            </p>

            <!-- Card dentro del mismo contenedor -->
            <div class="bg-white shadow-sm border border-gray-100 p-4">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Datos de visita</h2>

                <div class="flex flex-col gap-4">
                    <!-- A quién visita -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            A quien visita
                        </label>
                        <div class="relative">
                            <select
                                class="w-full bg-white border border-gray-300 rounded-md px-4 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent appearance-none cursor-pointer">
                                <option value="seleccione aqui">Seleccione aquí</option>
                                <option value="marta">MIRTA LOPEZ TORRES</option>
                            </select>
                            <div
                                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Lugar de reunión -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            Lugar de reunión
                        </label>
                        <div class="relative">
                            <select
                                class="w-full bg-white border border-gray-300 rounded-md px-4 py-2 text-gray-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent appearance-none cursor-pointer">
                                <option value="">Seleccionar aquí</option>
                            </select>
                            <div
                                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="flex flex-row justify-center gap-4 mt-4">
                    <a href="registro-de-visitas">
                        <div>
                            <button
                                class="px-8 py-2 bg-[#e2f1f8] border border-gray-300 text-gray-700 font-medium transition transform hover:scale-105 duration-200 ease-in-out">
                                REGRESAR
                            </button>
                        </div>
                    </a>

                    <button
                        class="px-8 py-2 bg-[#2f598a] text-white font-medium transition transform hover:scale-105 duration-200 ease-in-out">
                        CONTINUAR
                    </button>
                </div>
            </div>
            <!-- Fin card -->

        </div>
        <!-- Fin contenedor único -->

    </div>

    <!-- Footer siempre al fondo -->
    <footer class="bg-[#26292e] text-white py-5 text-center text-sm font-medium mt-auto">
        SECRETARÍA DE GOBIERNO Y TRANSFORMACIÓN DIGITAL © 2026
    </footer>
</div>
